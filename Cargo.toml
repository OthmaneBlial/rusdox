[package]
name = "rusdox"
version = "0.1.1"
edition = "2021"
default-run = "rusdox"
autobins = false
license = "MIT"
description = "Generate DOCX and PDF from YAML at Rust speed."
repository = "https://github.com/OthmaneBlial/rusdox"
homepage = "https://othmaneblial.github.io/rusdox/"
documentation = "https://docs.rs/rusdox"
readme = "README.md"
keywords = ["docx", "pdf", "yaml", "ooxml", "documents"]
categories = ["command-line-utilities", "parser-implementations", "encoding"]
include = [
  "/src/**",
  "/Cargo.toml",
  "/Cargo.lock",
  "/README.md",
  "/ROADMAP.md",
  "/CHANGELOG.md",
  "/LICENSE",
  "/SECURITY.md",
  "/docs/**",
  "/schema/**",
  "/editors/vscode/**",
  "/tests/**",
  "!/tests/golden/**",
  "/examples/*.yaml",
  "/examples/fragments/**",
  "/examples/README.md",
  "/templates/**",
  "/assets/rusdox-mark.svg",
  "/assets/signature-demo.svg",
]

[lib]
name = "rusdox"
path = "src/lib.rs"

[[bin]]
name = "rusdox"
path = "src/bin/rusdox.rs"

[[bin]]
name = "generate_stress_1000_pages_yaml"
path = "src/bin/generate_stress_1000_pages_yaml.rs"
required-features = ["maintainer-tools"]

[[bin]]
name = "stress_1000_pages"
path = "src/bin/stress_1000_pages.rs"
required-features = ["maintainer-tools"]

[features]
default = []
maintainer-tools = []

[dependencies]
bitflags = "2.6"
clap = { version = "4.6", features = ["derive"] }
dialoguer = "0.12"
ed25519-dalek = { version = "3.0", default-features = false, features = ["fast"] }
fontdb = "0.23"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
miniz_oxide = "0.9"
pdf-writer = "0.15"
quick-xml = "0.41"
resvg = { version = "0.47", default-features = false, features = ["system-fonts", "text"] }
schemars = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
sha2 = "0.10"
tempfile = "3.27"
thiserror = "2.0"
toml = "1.1"
ttf-parser = "0.25"
ureq = { version = "3.4", default-features = false, features = ["rustls"] }
zip = { version = "8.5", default-features = false, features = ["deflate"] }

[profile.dev]
opt-level = 2

[profile.dev.package."*"]
opt-level = 3

name: RusDox invoice

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-invoice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: OthmaneBlial/rusdox@c74a0f44bf03065fe5ca4d4d215bd78cac59f8b5 # v1.0.0
        with:
          input: documents/invoice.yaml
          output-root: artifacts/invoice
          comment: "false"
          retention-days: "7"

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">RusDox install-to-output demo</title>
  <desc id="desc">A 24 second animated walkthrough: install RusDox, initialize and edit YAML, render it, then inspect editable DOCX and native PDF outputs.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffdf8"/>
      <stop offset="1" stop-color="#efe6d9"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#241f1a" flood-opacity=".16"/>
    </filter>
    <style>
      .ui { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .step { opacity: 0; }
      .one { animation: one 24s infinite; }
      .two { animation: two 24s infinite; }
      .three { animation: three 24s infinite; }
      .four { animation: four 24s infinite; }
      .cursor { animation: blink .8s steps(1) infinite; }
      @keyframes one { 0%, 22% { opacity: 1 } 27%, 100% { opacity: 0 } }
      @keyframes two { 0%, 22% { opacity: 0 } 27%, 47% { opacity: 1 } 52%, 100% { opacity: 0 } }
      @keyframes three { 0%, 47% { opacity: 0 } 52%, 68% { opacity: 1 } 73%, 100% { opacity: 0 } }
      @keyframes four { 0%, 68% { opacity: 0 } 73%, 96% { opacity: 1 } 100% { opacity: 0 } }
      @keyframes blink { 0%, 50% { opacity: 1 } 51%, 100% { opacity: 0 } }
      @media (prefers-reduced-motion: reduce) {
        .step { animation: none; opacity: 0; }
        .four { opacity: 1; }
        .cursor { animation: none; }
      }
    </style>
  </defs>

  <rect width="1200" height="675" fill="#f5f1e8"/>
  <path d="M0 92H1200M0 582H1200" stroke="#d8d0c2"/>
  <circle cx="64" cy="47" r="22" fill="#b85c30"/>
  <text x="64" y="55" text-anchor="middle" class="ui" font-size="21" font-weight="800" fill="#fffaf5">R</text>
  <text x="99" y="43" class="ui" font-size="20" font-weight="800" fill="#241f1a">RusDox</text>
  <text x="99" y="65" class="mono" font-size="12" fill="#6a635c">one spec → editable DOCX + native PDF</text>
  <g class="ui" font-size="13" font-weight="700">
    <rect x="850" y="28" width="94" height="38" rx="19" fill="#f2dfd2"/>
    <text x="897" y="52" text-anchor="middle" fill="#8f4521">LOCAL</text>
    <rect x="954" y="28" width="94" height="38" rx="19" fill="#f2dfd2"/>
    <text x="1001" y="52" text-anchor="middle" fill="#8f4521">NO WORD</text>
    <rect x="1058" y="28" width="94" height="38" rx="19" fill="#241f1a"/>
    <text x="1105" y="52" text-anchor="middle" fill="#fffaf5">0.1.1</text>
  </g>

  <g class="step one">
    <text x="60" y="137" class="mono" font-size="13" font-weight="700" letter-spacing="2" fill="#8f4521">01 / INSTALL</text>
    <text x="60" y="182" class="ui" font-size="33" font-weight="800" fill="#241f1a">Start from a clean shell.</text>
    <g filter="url(#shadow)">
      <rect x="60" y="218" width="1080" height="310" rx="14" fill="#211d1a"/>
      <path d="M60 268H1140" stroke="#514943"/>
      <circle cx="89" cy="243" r="6" fill="#e97155"/><circle cx="109" cy="243" r="6" fill="#e8ba55"/><circle cx="129" cy="243" r="6" fill="#64b782"/>
      <text x="600" y="248" text-anchor="middle" class="mono" font-size="12" fill="#bdb29f">zsh — clean machine</text>
      <text x="92" y="315" class="mono" font-size="18" fill="#f5e7d8">$ curl -fsSL raw.githubusercontent.com/.../install.sh | sh</text>
      <text x="92" y="363" class="mono" font-size="17" fill="#bdb29f">Downloading rusdox-aarch64-apple-darwin.tar.gz</text>
      <text x="92" y="403" class="mono" font-size="17" fill="#8fd3a7">✓ Verified SHA-256</text>
      <text x="92" y="443" class="mono" font-size="17" fill="#8fd3a7">✓ Installed rusdox 0.1.1</text>
      <text x="92" y="489" class="mono" font-size="17" fill="#f5e7d8">$ rusdox --version</text>
      <rect class="cursor" x="319" y="473" width="10" height="22" fill="#b85c30"/>
    </g>
  </g>

  <g class="step two">
    <text x="60" y="137" class="mono" font-size="13" font-weight="700" letter-spacing="2" fill="#8f4521">02 / INITIALIZE + EDIT</text>
    <text x="60" y="182" class="ui" font-size="33" font-weight="800" fill="#241f1a">The source remains readable.</text>
    <g filter="url(#shadow)">
      <rect x="60" y="218" width="1080" height="310" rx="14" fill="#fffdf8" stroke="#d8d0c2"/>
      <rect x="60" y="218" width="230" height="310" rx="14" fill="#2a2420"/>
      <path d="M290 218V528" stroke="#d8d0c2"/>
      <text x="91" y="258" class="mono" font-size="12" font-weight="700" fill="#bdb29f">EXPLORER</text>
      <text x="91" y="302" class="mono" font-size="15" fill="#fffaf5">▾ my-rusdox-docs</text>
      <rect x="76" y="319" width="198" height="38" rx="6" fill="#493d35"/>
      <text x="104" y="343" class="mono" font-size="14" fill="#f5e7d8">launch-brief.yaml</text>
      <text x="326" y="258" class="mono" font-size="13" fill="#8f857b">launch-brief.yaml</text>
      <g class="mono" font-size="16">
        <text x="326" y="302" fill="#6a635c">1</text><text x="365" y="302" fill="#8f4521">output_name:</text><text x="506" y="302" fill="#241f1a">launch-brief</text>
        <text x="326" y="338" fill="#6a635c">2</text><text x="365" y="338" fill="#8f4521">blocks:</text>
        <text x="326" y="374" fill="#6a635c">3</text><text x="365" y="374" fill="#241f1a">- type: title</text>
        <text x="326" y="410" fill="#6a635c">4</text><text x="389" y="410" fill="#8f4521">text:</text><text x="459" y="410" fill="#241f1a">Launch Brief</text>
        <text x="326" y="446" fill="#6a635c">5</text><text x="365" y="446" fill="#241f1a">- type: metric</text>
        <rect x="382" y="461" width="372" height="36" rx="5" fill="#f2dfd2"/>
        <text x="326" y="486" fill="#6a635c">6</text><text x="389" y="486" fill="#8f4521">value:</text><text x="475" y="486" fill="#241f1a">24% pipeline growth</text>
      </g>
    </g>
  </g>

  <g class="step three">
    <text x="60" y="137" class="mono" font-size="13" font-weight="700" letter-spacing="2" fill="#8f4521">03 / RENDER</text>
    <text x="60" y="182" class="ui" font-size="33" font-weight="800" fill="#241f1a">One command, two first-class files.</text>
    <g filter="url(#shadow)">
      <rect x="60" y="218" width="1080" height="310" rx="14" fill="#211d1a"/>
      <path d="M60 268H1140" stroke="#514943"/>
      <circle cx="89" cy="243" r="6" fill="#e97155"/><circle cx="109" cy="243" r="6" fill="#e8ba55"/><circle cx="129" cy="243" r="6" fill="#64b782"/>
      <text x="92" y="321" class="mono" font-size="20" fill="#f5e7d8">$ rusdox launch-brief.yaml</text>
      <text x="92" y="373" class="mono" font-size="17" fill="#8fd3a7">✓ generated/launch-brief.docx</text>
      <text x="92" y="415" class="mono" font-size="17" fill="#8fd3a7">✓ rendered/launch-brief.pdf</text>
      <path d="M92 452H1108" stroke="#514943"/>
      <text x="92" y="491" class="mono" font-size="15" fill="#bdb29f">parse 1.8 ms  ·  compose 0.9 ms  ·  DOCX 3.4 ms  ·  PDF 4.1 ms</text>
    </g>
  </g>

  <g class="step four">
    <text x="60" y="137" class="mono" font-size="13" font-weight="700" letter-spacing="2" fill="#8f4521">04 / INSPECT REAL OUTPUTS</text>
    <text x="60" y="182" class="ui" font-size="33" font-weight="800" fill="#241f1a">Editable for them. Deterministic for you.</text>
    <g filter="url(#shadow)">
      <rect x="60" y="218" width="310" height="310" rx="12" fill="#2a2420"/>
      <text x="87" y="252" class="mono" font-size="12" font-weight="700" fill="#e6aa86">YAML SOURCE</text>
      <g class="mono" font-size="14">
        <text x="87" y="294" fill="#e6aa86">output_name:</text><text x="214" y="294" fill="#fffaf5">launch-brief</text>
        <text x="87" y="330" fill="#e6aa86">blocks:</text>
        <text x="87" y="366" fill="#fffaf5">- type: title</text>
        <text x="111" y="398" fill="#e6aa86">text:</text><text x="169" y="398" fill="#fffaf5">Launch Brief</text>
        <text x="87" y="434" fill="#fffaf5">- type: metric</text>
        <text x="111" y="466" fill="#e6aa86">value:</text><text x="179" y="466" fill="#fffaf5">24% growth</text>
      </g>
      <rect x="397" y="218" width="332" height="310" rx="12" fill="url(#paper)" stroke="#d8d0c2"/>
      <rect x="424" y="244" width="278" height="256" fill="#fff" stroke="#d8d0c2"/>
      <text x="445" y="273" class="mono" font-size="10" font-weight="700" fill="#2563a8">EDITABLE DOCX</text>
      <text x="445" y="320" class="ui" font-size="25" font-weight="800" fill="#241f1a">Launch Brief</text>
      <rect x="445" y="345" width="101" height="4" fill="#b85c30"/>
      <text x="445" y="392" class="ui" font-size="12" font-weight="700" fill="#6a635c">PIPELINE GROWTH</text>
      <text x="445" y="440" class="ui" font-size="38" font-weight="800" fill="#b85c30">24%</text>
      <text x="445" y="471" class="ui" font-size="11" fill="#6a635c">Ready for review in Word</text>
      <rect x="756" y="218" width="384" height="310" rx="12" fill="url(#paper)" stroke="#d8d0c2"/>
      <rect x="783" y="244" width="330" height="256" fill="#fff" stroke="#d8d0c2"/>
      <text x="806" y="273" class="mono" font-size="10" font-weight="700" fill="#b85c30">NATIVE PDF</text>
      <text x="806" y="320" class="ui" font-size="25" font-weight="800" fill="#241f1a">Launch Brief</text>
      <rect x="806" y="345" width="101" height="4" fill="#b85c30"/>
      <text x="806" y="392" class="ui" font-size="12" font-weight="700" fill="#6a635c">PIPELINE GROWTH</text>
      <text x="806" y="440" class="ui" font-size="38" font-weight="800" fill="#b85c30">24%</text>
      <text x="806" y="471" class="ui" font-size="11" fill="#6a635c">Rendered locally without Word</text>
    </g>
  </g>

  <text x="60" y="625" class="mono" font-size="13" fill="#6a635c">24-SECOND WORKFLOW · INSTALL → EDIT → RENDER → INSPECT</text>
  <g transform="translate(932 607)">
    <rect width="208" height="34" rx="17" fill="#b85c30"/>
    <text x="104" y="22" text-anchor="middle" class="ui" font-size="12" font-weight="800" fill="#fffaf5">NO CLOUD · NO OFFICE SUITE</text>
  </g>
</svg>

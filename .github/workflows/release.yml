name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin: rusdox
            archive: tar.gz
          - os: macos-15-intel
            target: x86_64-apple-darwin
            bin: rusdox
            archive: tar.gz
          - os: macos-15
            target: aarch64-apple-darwin
            bin: rusdox
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: rusdox.exe
            archive: zip

    steps:
      - uses: actions/checkout@v7

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release --locked --bin rusdox --target ${{ matrix.target }}

      - name: Verify binary version
        if: matrix.os != 'windows-latest'
        run: target/${{ matrix.target }}/release/${{ matrix.bin }} --version | grep "${GITHUB_REF_NAME#v}"

      - name: Verify binary version on Windows
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $output = & "target/${{ matrix.target }}/release/${{ matrix.bin }}" --version
          if ($output -notmatch [regex]::Escape($env:GITHUB_REF_NAME.TrimStart('v'))) {
            throw "Binary version '$output' does not match tag '$env:GITHUB_REF_NAME'"
          }

      - name: Package tar.gz
        if: matrix.archive == 'tar.gz'
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/${{ matrix.bin }} dist/${{ matrix.bin }}
          tar -czf rusdox-${{ matrix.target }}.tar.gz -C dist ${{ matrix.bin }}

      - name: Package zip
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.bin }}" "dist/${{ matrix.bin }}"
          Compress-Archive -Path "dist/${{ matrix.bin }}" -DestinationPath "rusdox-${{ matrix.target }}.zip" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: rusdox-${{ matrix.target }}
          path: rusdox-${{ matrix.target }}.${{ matrix.archive }}

  release:
    name: Publish signed release
    runs-on: ubuntu-latest
    needs: build
    permissions:
      actions: read
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write

    steps:
      - uses: actions/checkout@v7

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: rusdox-*
          merge-multiple: true

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: rusdox-${{ github.ref_name }}.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Generate SHA-256 checksums
        run: |
          sha256sum rusdox-*.tar.gz rusdox-*.zip > SHA256SUMS
          sha256sum --check SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest@v4
        with:
          subject-path: |
            rusdox-*.tar.gz
            rusdox-*.zip

      - name: Attest SBOM for release archives
        uses: actions/attest@v4
        with:
          subject-path: |
            rusdox-*.tar.gz
            rusdox-*.zip
          sbom-path: rusdox-${{ github.ref_name }}.spdx.json

      - name: Create draft release and attach assets
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            rusdox-*.tar.gz
            rusdox-*.zip
            rusdox-${{ github.ref_name }}.spdx.json
            SHA256SUMS

      - name: Publish release after every asset is attached
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false

  publish-crate:
    name: Publish crate
    runs-on: ubuntu-latest
    needs: build
    environment: crates-io
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v7

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Verify publishable package
        run: cargo publish --locked --dry-run

      - name: Request a short-lived crates.io token
        id: crates-io-auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}
        run: cargo publish --locked

  smoke-install:
    name: Smoke install (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: release
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v7

      - name: Test release installer
        if: matrix.os != 'windows-latest'
        env:
          RUSDOX_VERSION: ${{ github.ref_name }}
          RUSDOX_INSTALL_DIR: ${{ runner.temp }}/rusdox-bin
        run: |
          sh scripts/install.sh
          "$RUSDOX_INSTALL_DIR/rusdox" --version | grep "${GITHUB_REF_NAME#v}"

      - name: Test Windows release installer
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          ./scripts/install.ps1 -Version $env:GITHUB_REF_NAME -InstallDir "$env:RUNNER_TEMP/rusdox-bin"
          $output = & "$env:RUNNER_TEMP/rusdox-bin/rusdox.exe" --version
          if ($output -notmatch [regex]::Escape($env:GITHUB_REF_NAME.TrimStart('v'))) {
            throw "Installed version '$output' does not match tag '$env:GITHUB_REF_NAME'"
          }

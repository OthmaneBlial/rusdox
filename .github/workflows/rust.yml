name: Rust

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v7

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --locked

      - name: Verify generated static documentation
        if: matrix.os == 'ubuntu-latest'
        run: |
          node scripts/build_site.mjs --check
          node scripts/check_site.mjs

      - name: Verify crate package
        if: matrix.os == 'ubuntu-latest'
        run: cargo package --locked --no-verify

      - name: Build release binary for installer fixture
        run: cargo build --release --locked --bin rusdox

      - name: Test Unix installer with checksums
        if: matrix.os != 'windows-latest'
        run: sh scripts/test_install.sh target/release/rusdox

      - name: Test Windows installer with checksums
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: ./scripts/test_install.ps1 -BinaryPath target/release/rusdox.exe

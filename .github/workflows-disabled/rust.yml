name: Rust

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin: rusdox
          - os: macos-latest
            target: aarch64-apple-darwin
            bin: rusdox
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: rusdox.exe

    steps:
      - uses: actions/checkout@v7

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --locked

      - name: Verify gallery DOCX/PDF parity
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          mkdir -p target/parity
          cargo run --locked -- verify examples \
            --output-root target/parity \
            --visual-baseline tests/golden/pages/linux-x86_64 \
            --visual-threshold 0 \
            --format json > target/parity/summary.json

      - name: Upload gallery parity reports and rendered diffs
        if: matrix.os == 'ubuntu-latest' && always()
        uses: actions/upload-artifact@v4
        with:
          name: gallery-parity-${{ github.sha }}
          path: target/parity/
          if-no-files-found: error
          retention-days: 14

      - name: Verify generated static documentation
        if: matrix.os == 'ubuntu-latest'
        run: |
          node scripts/build_benchmark_dashboard.mjs --check
          node scripts/build_site.mjs --check
          node scripts/check_site.mjs
          node playground/test.mjs
          node scripts/build_template_registry.mjs --check
          node scripts/build_v1_registry_manifest.mjs --check
          node scripts/build_template_registry.mjs --registry-dir registry/v1 --check
          node scripts/test_github_action.mjs
          node scripts/test_integrations.mjs
          node scripts/starter_issues.mjs
          node scripts/test_contributor_lab.mjs
          node scripts/check_contributors.mjs
          node scripts/check_stable_contracts.mjs
          node scripts/check_compatibility_contract.mjs
          node scripts/check_accessibility_contract.mjs
          node scripts/test_benchmark_contract.mjs
          node scripts/test_reproducible_release.mjs
          node scripts/check_security_review.mjs

      - name: Build complete public API documentation
        if: matrix.os == 'ubuntu-latest'
        env:
          RUSTDOCFLAGS: -D missing_docs -D rustdoc::broken_intra_doc_links
        run: cargo doc --locked --no-deps --lib

      - name: Verify crate package
        if: matrix.os == 'ubuntu-latest'
        run: cargo package --locked --no-verify

      - name: Build release binary twice at a stable clean path
        id: reproducibility
        run: >-
          python scripts/verify_reproducible_build.py
          --target ${{ matrix.target }}
          --binary ${{ matrix.bin }}
          --report rusdox-${{ matrix.target }}.reproducibility.json

      - name: Upload differing binaries for reproducibility diagnosis
        if: failure() && steps.reproducibility.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: reproducibility-diagnostics-${{ matrix.target }}-${{ github.sha }}
          path: target/reproducibility-diagnostics/${{ matrix.target }}/
          if-no-files-found: error
          retention-days: 7

      - name: Upload branch reproducibility receipt
        uses: actions/upload-artifact@v7
        with:
          name: reproducibility-${{ matrix.target }}-${{ github.sha }}
          path: rusdox-${{ matrix.target }}.reproducibility.json
          retention-days: 14

      - name: Smoke reusable RusDox action
        if: matrix.os == 'ubuntu-latest'
        uses: ./
        with:
          input: examples/hello_world.yaml
          output-root: target/github-action-smoke
          binary: target/${{ matrix.target }}/release/${{ matrix.bin }}
          upload-reports: "false"
          comment: "false"

      - name: Test Unix installer with checksums
        if: matrix.os != 'windows-latest'
        run: sh scripts/test_install.sh target/${{ matrix.target }}/release/${{ matrix.bin }}

      - name: Test Windows installer with checksums
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: ./scripts/test_install.ps1 -BinaryPath target/${{ matrix.target }}/release/${{ matrix.bin }}

  fuzz-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install nightly Rust
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --version 0.13.2 --locked

      - name: Compile fuzz targets
        run: cargo +nightly fuzz build

  msrv:
    name: MSRV 1.88
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install minimum supported Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88.0

      - name: Cache Cargo for MSRV
        uses: Swatinem/rust-cache@v2
        with:
          key: msrv-1.88

      - name: Compile every feature on the MSRV
        run: cargo +1.88.0 check --locked --all-features
